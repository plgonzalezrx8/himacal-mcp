[project]
name = "himacal-mcp"
version = "0.1.0"
description = "Private HTTP MCP for Himalaya email and CalDAV calendars"
requires-python = ">=3.13,<3.14"
dependencies = [
  "mcp==2.3.0",
  "caldav==3.7.0",
  "icalendar==7.3.0",
  "tomli-w==1.2.0",
  "pydantic>=2.11,<3",
  "uvicorn>=0.34,<1",
  "python-dateutil>=2.9,<3",
  "recurring-ical-events==3.8.2",
]

[project.scripts]
himacal-mcp = "himacal.server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.12,<1", "radicale==3.9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires disposable provider containers"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/himacal"]
